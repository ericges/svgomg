name: CLA

# Contributions come in under MIT while the project itself does not — see
# CONTRIBUTING.md. GitHub's Terms of Service (§ D.6) put contributions under the
# repository's own licence unless a separate agreement supersedes them, so that
# agreement needs a record of assent. This bot is that record.
#
# `pull_request_target` runs with a write token in the *base* repository's
# context. This workflow must therefore never check out or run the pull
# request's code, and it does not.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contribution licence
    runs-on: ubuntu-latest

    steps:
      - name: Check or record assent
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the contribution terms and I license my contribution under the MIT License'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/ericges/omsvg/blob/main/CONTRIBUTING.md#licensing-and-copyright"
          path-to-signatures: "signatures/version1/cla.json"
          branch: "main"
          # The copyright holder has nothing to agree to, and Dependabot cannot
          # agree to anything — so the bot says nothing on their pull requests.
          # Without this it would comment on every one of them.
          allowlist: ericges,dependabot[bot]
          custom-pr-sign-comment: "I have read the contribution terms and I license my contribution under the MIT License"
          custom-notsigned-prcomment: "Thanks for the pull request. OMSVG is source-available rather than open source, but contributions come in under the **MIT License** — the terms are linked below, and they're short. Confirm them by posting the comment below on this pull request; your reply is recorded and that's all that's needed."
          custom-allsigned-prcomment: "Recorded — thank you. Your contribution comes in under the MIT License, and its copyright line goes into `NOTICE.md` when it's merged."
          lock-pullrequest-aftermerge: false
